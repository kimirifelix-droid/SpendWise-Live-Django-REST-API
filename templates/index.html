<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SpendWise Live</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <h1>SpendWise Live</h1>

    <section id="auth">
      <h2>Login</h2>
      <input id="username" placeholder="username">
      <input id="password" placeholder="password" type="password">
      <button id="loginBtn">Login</button>
      <button id="logoutBtn" style="display:none">Logout</button>
    </section>

    <section id="controls" style="display:none">
      <h2>Expenses</h2>
      <div>
        <input id="search" placeholder="Search description">
        <button id="searchBtn">Search</button>
      </div>
      <div id="categoryFilters">
        <button data-cat="">All</button>
        <button data-cat="food">Food</button>
        <button data-cat="transport">Transport</button>
        <button data-cat="entertainment">Entertainment</button>
        <button data-cat="bills">Bills</button>
        <button data-cat="other">Other</button>
      </div>

      <ul id="expenses"></ul>

      <h3>Add Expense</h3>
      <input id="amount" placeholder="Amount">
      <input id="desc" placeholder="Description">
      <select id="category">
        <option value="food">Food</option>
        <option value="transport">Transport</option>
        <option value="entertainment">Entertainment</option>
        <option value="bills">Bills</option>
        <option value="other" selected>Other</option>
      </select>
      <button id="addBtn">Add</button>
    </section>

    <script src="/static/script.js"></script>
  </body>
</html>
